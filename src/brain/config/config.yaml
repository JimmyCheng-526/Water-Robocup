brain_node:
  ros__parameters:
    game:
      team_id: 29 # must be consistant with GameControl
      player_id: 1 # 1 | 2 | 3 | 4 | 5
      field_type: "adult_size" # adult_size | kid_size | robo_league
      player_role: "striker" # striker | goal_keeper
      treat_person_as_robot: false # 是否将人类视为机器人, 用于调试. !!!! 正式比赛时, 必须设置为 false !!!!
      number_of_players: 3
      
    robot:
      robot_height: 1.0 # 用于大概估算检测到的物体相对于机器人头的 pitch 角
      odom_factor: 1.2 # 大概估算 odom 中给出的距离与实际行走的距离的比例, 对 odom 进行修正
      vx_factor: 0.90 # 修正步态 x 与 y 的差异
      yaw_offset: 0.20 # 修正步态的前进角度
      vx_limit: 1.7 # 步态 x 速度限制
      vy_limit: 0.5 # 步态 y 速度限制
      vtheta_limit: 1.5 # 步态角速度限制

    strategy:
      ball_confidence_threshold: 30.0 # confidence 低于这个阈值, 认为不是球 (注意detection模块目前传入目标置信度都是 > 20 的)
      ball_memory_timeout: 3.0 # 球记忆失效时间, 超过这个时间没有看到球, 认为球丢了
      tm_ball_dist_threshold: 1.5 # 队友发送的球的位置与我当前位置的距离, 如果大于此值, 则认为队友的信息准确. (因为双方定位精度问题, 如果这个距离太小, 则会使我产生大方向上的误判. 例如, 队友给的球的位置在我身前, 而实际球在我身后. 因为队友给我的不是球相对于我的位置, 而是相对于球场的位置)
      limit_near_ball_speed: true # 是否限制在 chase 时靠近球时的速度
      near_ball_speed_limit: 0.6 # 靠近球时的速度限制
      near_ball_range: 2.0 # 在这个范围内, 认为靠近球了, 进行限速
      abort_kick_when_ball_moved: true # kick 过程中, 如果能明确感知到球已经不在 kick 路线上或已经踢中了, 则直接退出 kick
      cooperation: # 队友间协作相关配置
        enable_role_switch: true # 开启后, 会根据场上裁判机上存活的队友数量, 来自动决定自己的角色, 当场上不满员时, 我变为 striker.
        ball_control_cost_threshold: 7.0 # 队友踢球的 cost 小于此值时, 我不再上前抢球, 而是转为助攻

    obstacle_avoidance:
      depth_sample_step: 16 # 障碍物检测时, 深度图采样点的步长
      obstacle_min_height: 0.35 # 障碍物高度阈值, 高于此值的点视为障碍物
      grid_size: 0.2 # 障碍物检测时, 占用网格的边长
      max_x: 3.0 # 在前方 x: [0, max_x] 范围内检测障碍物
      max_y: 5.0 # 在左右 y: [-max_y, max_y] 范围内检测障碍物
      exclusion_x: 0.3 # 排除 x 轴范围, 即排除机器人自己, 此范围外的点视为障碍物
      exclusion_y: 0.4 # 排除 y 轴范围, 即排除机器人自己, 此范围外的点视为障碍物
      ball_exclusion_radius: 0.0 # 球周围这个半径内的障碍物认为不是障碍
      ball_exclusion_height: 0.3 # 球周围这个高度内的障碍物认为不是障碍
      occupancy_threshold: 5 # 障碍物阈值, 在世界坐标系的一个网格内, 高于指定高度的深度采样点数大于些值, 则认为存在障碍物
      collision_threshold: 0.3 # 碰撞阈值, 当障碍物与机器人的距离小于此值, 则认为发生碰撞, 相当于机器人的碰撞半径
      safe_distance: 1.0 # 安全距离, 当障碍物距离小于此值时, 认为需要避障
      avoid_secs: 2.0 # 避障时, 每次绕行障碍物的时长
      enable_freekick_avoid: true # 是否在自由球起始放置时避障
      freekick_start_placing_safe_distance: 0.5 # 自由球起始放置时, 避障安全距离, 如果球在此范围内, 则认为需要避障
      freekick_start_placing_avoid_secs: 1.5 # 自由球起始放置时, 避障绕行时间
      obstacle_memory_msecs: 500. # 视野外的障碍物, 在记忆中保持的时间(毫秒)
      avoid_during_kick: false # 是否在 kick 时避障, 如果为 true, 则有障碍物时就不会踢球, 只会挡住对方
      kick_ao_safe_dist: 1.0 # kick 时的避障安全距离
      kick_ao_use_shoot: false # 当 avoid_during_kick 为true 时, 此值为 true 时, 使用 shoot 进行踢球; 此值为 false 时, 则直接不踢, 只原地踏步.
      avoid_during_chase: false # 是否在 chase 时避障
      chase_ao_safe_dist: 1.5 # chase 时的避障安全距离

    locator:
      min_marker_count: 5 # 最少看到多少到 marker, 才可以进行粒子滤波定位
      max_residual: 0.3 # 粒子滤波定位时, 最终每个粒子的加权偏差大于此值时, 认为定位不成功

    enable_com: true  # 是否开启队友间通信

    rerunLog:
      enable_tcp: false # 是否通过网络传输 log
      server_ip: "127.0.0.1:9876" # 开启了 rerun Viewer 的机器地址
      enable_file: false # 是否将 log 写入本地
      log_dir: "/home/booster/Workspace/rrlog" # 本地 log 存储路径, 会在此路径下生成以时间为开头的文件
      max_log_file_mins: 5.0 # 本地 log 最长多少分钟就分片存储. 太大的文件会导致读的时候死机.
      img_interval: 1 #每多少帧图像 log 一次, 如果希望更好的实时性或减少日志大小, 可以调高这个值. 但会造成 log 的时间精度降低.
    
    recovery:
      retry_max_count: 2

    vision:
        image_topic: "/camera/camera/color/image_raw" #realsense
        depth_image_topic: "/camera/camera/aligned_depth_to_color/image_raw" #realsense
        cam_pixel_width: 1280. # 相机像素宽度
        cam_pixel_height: 720. # 相机像素高度
        cam_fov_x: 90.0 # 相机视场角, 单位: 度, realsense
        cam_fov_y: 60.0 # 相机视场角, 单位: 度, realsence
    
    game_control_ip: "192.168.43.46"

    # for fun and debug
    sound:
      enable: false # 是否播放声音
      sound_pack: "espeak" # espeak 或 语音名名称, 假设语音包名称为 <name>, 相应的语音文件需放到: sound_play/sounds/ 目录下, 以<name>-xx.mp3 命名
